<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Basalt app icon. The signature four-column basalt sync indicator: cooled
    volcanic columns (column-rock) with a live molten seam glowing at their tops
    (ember). Two-colour story only — basalt black + ember — so it reads at 16px.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#201e24"/>
      <stop offset="0.55" stop-color="#141317"/>
      <stop offset="1" stop-color="#0c0b0e"/>
    </linearGradient>
    <linearGradient id="col" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#514d5b"/>
      <stop offset="0.42" stop-color="#3a3742"/>
      <stop offset="1" stop-color="#242229"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc99f"/>
      <stop offset="0.32" stop-color="#ee8453"/>
      <stop offset="0.72" stop-color="#d45a31"/>
      <stop offset="1" stop-color="#d45a31" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8764a" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#e8764a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8764a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="90" y="90" width="844" height="844" rx="192"/>
    </clipPath>
  </defs>

  <rect x="90" y="90" width="844" height="844" rx="192" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- molten seam glow rising from behind the columns -->
    <ellipse cx="512" cy="452" rx="352" ry="300" fill="url(#bloom)"/>

    <!-- four basalt columns, varying heights like natural columnar basalt -->
    <!-- col 1 -->
    <rect x="277" y="470" width="98" height="470" rx="9" fill="url(#col)"/>
    <rect x="277" y="470" width="98" height="52" rx="9" fill="url(#cap)" opacity="0.85"/>
    <rect x="279" y="470" width="4" height="470" fill="#615c6e" opacity="0.5"/>
    <!-- col 2 (tallest — brightest molten cap) -->
    <rect x="401" y="372" width="98" height="568" rx="9" fill="url(#col)"/>
    <rect x="401" y="372" width="98" height="58" rx="9" fill="url(#cap)"/>
    <rect x="403" y="372" width="4" height="568" fill="#615c6e" opacity="0.5"/>
    <!-- col 3 (shortest) -->
    <rect x="525" y="548" width="98" height="392" rx="9" fill="url(#col)"/>
    <rect x="525" y="548" width="98" height="48" rx="9" fill="url(#cap)" opacity="0.7"/>
    <rect x="527" y="548" width="4" height="392" fill="#615c6e" opacity="0.5"/>
    <!-- col 4 -->
    <rect x="649" y="430" width="98" height="510" rx="9" fill="url(#col)"/>
    <rect x="649" y="430" width="98" height="54" rx="9" fill="url(#cap)" opacity="0.9"/>
    <rect x="651" y="430" width="4" height="510" fill="#615c6e" opacity="0.5"/>

    <!-- glassy top sheen -->
    <rect x="90" y="90" width="844" height="300" fill="url(#sheen)"/>
  </g>

  <!-- crisp edge -->
  <rect x="91.5" y="91.5" width="841" height="841" rx="190.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
</svg>
