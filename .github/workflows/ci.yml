# The merge gate: every pull request (and main) runs the same checks as the
# local pre-commit ritual. Pixel comparisons are skipped in CI on purpose —
# the committed baselines are rendered on macOS and Linux runners rasterize
# fonts differently — so Playwright runs every spec's functional assertions
# with --ignore-snapshots, and screenshot diffs stay a local concern.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer (typecheck + bundle)
        run: npm run build

      - name: Typecheck Electron main process
        run: npx tsc -p electron --noEmit

      - name: Unit tests (vitest)
        run: npx vitest run

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, snapshots ignored)
        run: npx playwright test --ignore-snapshots

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
